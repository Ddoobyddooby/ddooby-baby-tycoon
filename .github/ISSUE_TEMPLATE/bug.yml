name: 버그
description: 동작이 이상할 때
labels: ["type:bug"]
body:
  - type: textarea
    id: repro
    attributes:
      label: 재현 방법
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작 / 실제 동작
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 기기 / 브라우저
      placeholder: "iPhone 15, Safari"
